name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: TypeScript type checking
      run: bun run typecheck

    - name: Run ESLint
      run: bun x eslint src --ext .ts

    - name: Run Prettier check
      run: bun run format:check

    - name: Build project
      run: bun run build:ts

  test:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: quality
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [capture, interaction, lib]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install unzip (required by setup-bun)
      run: |
        apt-get update
        apt-get install -y unzip

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build project
      run: bun run build:ts

    - name: Run test shard
      run: |
        set +e
        bun run test:shard:${{ matrix.shard }} 2>&1 | tee test-output.log
        pkill -9 chrome || true
        if grep -q "0 fail" test-output.log; then
          echo "✅ Tests passed"
          exit 0
        else
          echo "❌ Tests failed"
          exit 1
        fi

  build-artifacts:
    name: Build Artifacts
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build for production
      run: bun run build:ts
    
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: |
          dist/
          playwright
        retention-days: 30